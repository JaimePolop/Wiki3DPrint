<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Captura ilustrada de ajustes de filamento en Bambu Studio</title>
  <desc id="desc">Interfaz recreada con el panel de filamento, el boton de editar preset y la ventana de ajustes del filamento.</desc>
