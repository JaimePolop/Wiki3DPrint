<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Suite de calibraciones de Bambu Studio</title>
  <desc id="desc">Resumen visual original de las calibraciones: temperatura, flujo, avance de presion, retraccion, flujo maximo y VFA.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset=".52" stop-color="#10253a"/>
      <stop offset="1" stop-color="#28162f"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36c8ff"/>
      <stop offset=".48" stop-color="#7a6cff"/>
      <stop offset="1" stop-color="#f04bb4"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#36c8ff"/>
      <stop offset=".35" stop-color="#27d77a"/>
      <stop offset=".66" stop-color="#ffd256"/>
      <stop offset="1" stop-color="#ff5a6b"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1280" height="760" rx="40" fill="url(#bg)"/>
  <rect width="1280" height="760" rx="40" fill="url(#grid)"/>
  <circle cx="140" cy="130" r="210" fill="#36c8ff" opacity=".13" filter="url(#glow)"/>
  <circle cx="1110" cy="610" r="260" fill="#f04bb4" opacity=".12" filter="url(#glow)"/>
  <rect x="54" y="48" width="1172" height="664" rx="34" fill="#07111f" opacity=".74" stroke="#334962"/>
  <text x="94" y="110" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="850">Calibraciones de Bambu Studio</text>
  <text x="94" y="148" fill="#b8c1cf" font-family="Inter, Arial, sans-serif" font-size="18">Orden practico para filamentos de terceros: medir, elegir, guardar preset y validar con pieza real.</text>
  <path d="M138 216H1142" stroke="url(#line)" stroke-width="7" stroke-linecap="round" opacity=".9" filter="url(#glow)"/>

  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(90 248)">
      <rect width="240" height="178" rx="26" fill="#142238" stroke="#3b506a"/>
      <text x="24" y="38" fill="#fff" font-size="20" font-weight="850">Temperatura</text>
      <rect x="28" y="62" width="36" height="86" rx="12" fill="url(#hot)"/>
      <g fill="#aeb8c6" font-size="13" font-weight="700">
        <text x="82" y="78">Torre por bloques</text>
        <text x="82" y="102">Brillo y detalle</text>
        <text x="82" y="126">Hilos y capas</text>
        <text x="82" y="150">Elige el mejor tramo</text>
      </g>
    </g>

    <g transform="translate(370 248)">
      <rect width="240" height="178" rx="26" fill="#142238" stroke="#3b506a"/>
      <text x="24" y="38" fill="#fff" font-size="20" font-weight="850">Flow rate</text>
      <path d="M32 84h70M32 112h92M32 140h54" stroke="#36c8ff" stroke-width="10" stroke-linecap="round"/>
      <g fill="#aeb8c6" font-size="13" font-weight="700">
        <text x="138" y="78">Paso 1</text>
        <text x="138" y="102">Paso 2</text>
        <text x="138" y="126">Top liso</text>
        <text x="138" y="150">Sin huecos</text>
      </g>
    </g>

    <g transform="translate(650 248)">
      <rect width="240" height="178" rx="26" fill="#142238" stroke="#3b506a"/>
      <text x="24" y="38" fill="#fff" font-size="20" font-weight="850">PA / valor K</text>
      <path d="M42 132h130q28 0 28-28V76q0-28-28-28H78q-28 0-28 28v56" fill="none" stroke="#f04bb4" stroke-width="9" stroke-linecap="round"/>
      <circle cx="50" cy="132" r="10" fill="#36c8ff"/>
      <g fill="#aeb8c6" font-size="13" font-weight="700">
        <text x="34" y="160">Torre, linea o patron</text>
      </g>
    </g>

    <g transform="translate(930 248)">
      <rect width="240" height="178" rx="26" fill="#142238" stroke="#3b506a"/>
      <text x="24" y="38" fill="#fff" font-size="20" font-weight="850">Retraccion</text>
      <path d="M42 124c36-58 72-58 108 0s72 58 108 0" transform="scale(.72) translate(0 18)" fill="none" stroke="#7a6cff" stroke-width="8" stroke-linecap="round"/>
      <path d="M38 142h150" stroke="#36c8ff" stroke-width="8" stroke-linecap="round"/>
      <g fill="#aeb8c6" font-size="13" font-weight="700">
        <text x="34" y="78">Longitud minima</text>
        <text x="34" y="102">que deja la torre limpia</text>
      </g>
    </g>

    <g transform="translate(230 472)">
      <rect width="340" height="164" rx="28" fill="#142238" stroke="#3b506a"/>
      <text x="28" y="40" fill="#fff" font-size="20" font-weight="850">Flujo maximo</text>
      <path d="M32 118h250" stroke="#263246" stroke-width="14" stroke-linecap="round"/>
      <path d="M32 118h190" stroke="url(#line)" stroke-width="14" stroke-linecap="round"/>
      <text x="32" y="78" fill="#b8c1cf" font-size="14" font-weight="800">Inicial + altura medida x paso</text>
      <text x="32" y="102" fill="#fff" font-size="18" font-weight="850">10 + (14 x 1) = 24 mm3/s</text>
    </g>

    <g transform="translate(710 472)">
      <rect width="340" height="164" rx="28" fill="#142238" stroke="#3b506a"/>
      <text x="28" y="40" fill="#fff" font-size="20" font-weight="850">VFA</text>
      <g stroke-width="5" stroke-linecap="round" fill="none">
        <path d="M36 124c20-72 40 72 60 0s40-72 60 0 40 72 60 0 40-72 60 0" stroke="#36c8ff"/>
        <path d="M36 94c20-36 40 36 60 0s40-36 60 0 40 36 60 0 40-36 60 0" stroke="#f04bb4" opacity=".72"/>
      </g>
      <text x="28" y="72" fill="#b8c1cf" font-size="14" font-weight="800">Patrones finos por velocidad</text>
    </g>
  </g>
</svg>
