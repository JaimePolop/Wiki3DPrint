<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Captura ilustrada de la vista de laminacion en Bambu Studio</title>
  <desc id="desc">Interfaz recreada mostrando el boton Slice plate, la vista Preview, el selector Line type y una leyenda de tipos de linea.</desc>
